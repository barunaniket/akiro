[package]
name = "akiro"
version = "0.1.0"
edition = "2021"
authors = ["barunaniket <barunaniket@gmail.com>"]
description = "High-Performance Distributed Sandboxed Code Execution Engine in Rust"
repository = "https://github.com/barunaniket/akiro"
homepage = "https://github.com/barunaniket/akiro"
readme = "README.md"
license = "MIT"
keywords = ["sandbox", "online-judge", "code-execution", "seccomp", "cgroups"]
categories = ["command-line-utilities", "concurrency", "network-programming"]

[dependencies]
nix = { version = "0.29", features = ["process", "resource", "sched", "mount", "signal", "time", "fs"] }
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
libc = "0.2"
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
redis = { version = "0.25", features = ["tokio-comp", "streams", "connection-manager"] }
futures-util = "0.3"
tokio-stream = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sandbox_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
